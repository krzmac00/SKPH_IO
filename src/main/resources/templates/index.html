<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Strona Główna</title>
    <!-- Załączenie Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Moja Aplikacja</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent" aria-controls="navbarContent"
                aria-expanded="false" aria-label="Przełącz nawigację">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav ms-auto">
                <!-- Przykładowe linki do logowania / rejestracji / profilu -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/auth/login}">Zaloguj</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/auth/register}">Zarejestruj</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Główna zawartość strony -->
<main class="container mt-4">
    <h1 class="mb-4">Witaj w naszej aplikacji!</h1>

    <div class="row">
        <div class="col-md-6">
            <h3>Zasoby</h3>
            <ul class="list-group">
                <li class="list-group-item">
                    <a th:href="@{/resources}">Lista wszystkich zasobów</a>
                </li>
                <li class="list-group-item">
                    <a th:href="@{/resources/available}">Zasoby dostępne</a>
                </li>
                <li class="list-group-item">
                    <a th:href="@{/resources/assigned}">Zasoby przydzielone</a>
                </li>
                <li class="list-group-item">
                    <a th:href="@{/resources/human}">Zasoby ludzkie</a>
                </li>
                <li class="list-group-item">
                    <a th:href="@{/resources/physical}">Zasoby fizyczne</a>
                </li>
                <li class="list-group-item">
                    <a th:href="@{/resources/new}">Dodaj nowy zasób</a>
                </li>
            </ul>

            <!-- Widok organizacji (tylko jeśli user jest AidOrganization) -->
            <p class="mt-3">
                <a class="btn btn-outline-secondary" th:href="@{/resources/org}">
                    Panel organizacji (AidOrganization)
                </a>
            </p>
        </div>

        <div class="col-md-6">
            <h3>Zadania</h3>
            <ul class="list-group">
                <li class="list-group-item">
                    <a th:href="@{/tasks}">Lista zadań</a>
                </li>
                <!-- Przykład linka do tworzenia nowego zadania (jeśli istnieje taki endpoint) -->
                <!--<li class="list-group-item">
                    <a th:href="@{/tasks/new}">Utwórz nowe zadanie</a>
                </li>-->
            </ul>

            <h3 class="mt-4">Mapa</h3>
            <ul class="list-group">
                <li class="list-group-item">
                    <a th:href="@{/map}">Otwórz mapę</a>
                </li>
            </ul>
        </div>
    </div>
</main>

<!-- Załączenie Bootstrap JS (wymagane do responsywnego menu) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
