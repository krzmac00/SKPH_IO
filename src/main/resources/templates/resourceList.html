<!-- resourceList.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista Zasobów</title>
</head>
<body>
<h1>Lista Zasobów</h1>

<!-- Link do formularza nowego zasobu -->
<p>
  <a th:href="@{/resources/new}">Dodaj nowy zasób</a>
</p>

<!-- Możesz dodać linki do filtrowania wg roli / statusu -->
<p>
  <a th:href="@{/resources/human}">Zasoby ludzkie</a> |
  <a th:href="@{/resources/physical}">Zasoby fizyczne</a> |
  <a th:href="@{/resources/available}">Dostępne</a> |
  <a th:href="@{/resources/assigned}">Przydzielone</a>
</p>

<table border="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>Nazwa</th>
    <th>Ilość</th>
    <th>Status</th>
    <th>Typ</th>
    <th>Akcje</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="res : ${resources}">
    <td th:text="${res.id}"></td>
    <td th:text="${res.name}"></td>
    <td th:text="${res.amount}"></td>
    <td th:text="${res.status}"></td>
    <td th:text="${res.resourceType}"></td>
    <td>
      <a th:href="@{'/resources/' + ${res.id}}">Szczegóły</a>
      <!-- Tylko jeśli zasób jest dostępny lub ALLOCATED, można przydzielić -->
      <span th:if="${res.status.name() == 'AVAILABLE' or res.status.name() == 'ALLOCATED'}">
         |
         <a th:href="@{'/resources/' + ${res.id} + '/assign'}">[Przydziel]</a>
      </span>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
